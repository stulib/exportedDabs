# Databricks Asset Bundle — pipeline-bike
# Docs: https://docs.databricks.com/aws/en/dev-tools/bundles/settings

bundle:
  name: pipeline-bike

include:
  - resources/**/*.yml

variables:
  catalog:
    description: Default catalog
    default: "dev"

  schema:
    description: Default schema
    default: "dbdemos_pipeline_bike"

  workspace_host:
    description: Workspace host URL for the target environment
    default: ""

  staging_sp_app_id:
    description: Service principal application (client) ID for staging deploys
    default: ""

  prod_sp_app_id:
    description: Service principal application (client) ID for prod deploys
    default: ""

targets:
  dev:
    mode: development
    default: true
    workspace:
      host: https://adb-7405613676539969.9.azuredatabricks.net

  staging:
    mode: production
    workspace:
      host: ${var.workspace_host}
      root_path: /Workspace/Shared/.bundle/${bundle.name}/${bundle.target}
    variables:
      workspace_host: https://<staging-workspace-host>.azuredatabricks.net
    run_as:
      service_principal_name: ${var.staging_sp_app_id}

  prod:
    mode: production
    workspace:
      host: ${var.workspace_host}
      root_path: /Workspace/Shared/.bundle/${bundle.name}/${bundle.target}
    variables:
      workspace_host: https://<prod-workspace-host>.azuredatabricks.net
    run_as:
      service_principal_name: ${var.prod_sp_app_id}
    permissions:
      - level: CAN_VIEW
        group_name: users
