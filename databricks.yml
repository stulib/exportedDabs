bundle:
  name: dabs_migrator_out

include:
  - resources/**/*.yml

variables:
  catalog:
    description: Default catalog
    default: classic_stable_aiy0te

  schema:
    description: Default schema
    default: dabs_test

  workspace_host:
    description: Target workspace URL (overridden per target under targets.<t>.variables)
    default: https://adb-7405613676539969.9.azuredatabricks.net

  staging_sp_app_id:
    description: Service principal application ID used to deploy to staging (set via CI secret)
    default: <staging-service-principal-application-id>

  prod_sp_app_id:
    description: Service principal application ID used to deploy to prod (set via CI secret)
    default: <prod-service-principal-application-id>

  warehouse_id:
    description: SQL warehouse ID for alerts, dashboards, genie spaces, and quality monitors
    default: <warehouse-id>

targets:
  dev:
    mode: development
    default: true
    workspace:
      host: https://adb-7405613676539969.9.azuredatabricks.net

  staging:
    mode: production
    workspace:
      host: ${var.workspace_host}
      root_path: /Workspace/Shared/.bundle/${bundle.name}/${bundle.target}
    variables:
      workspace_host: https://adb-7405613676539969.9.azuredatabricks.net
    run_as:
      service_principal_name: ${var.staging_sp_app_id}

  prod:
    mode: production
    workspace:
      host: ${var.workspace_host}
      root_path: /Workspace/Shared/.bundle/${bundle.name}/${bundle.target}
    variables:
      workspace_host: https://adb-7405613676539969.9.azuredatabricks.net
    run_as:
      service_principal_name: ${var.prod_sp_app_id}
    permissions:
      - level: CAN_VIEW
        group_name: users
