resources:
  jobs:
    init_pipeline_bike:
      name: init-pipeline-bike
      tasks:
        - task_key: generate_data
          notebook_task:
            # Points to the source notebook in the workspace.
            # For staging/prod: copy this notebook into the bundle under
            # src/init-pipeline-bike/ and update this path to a bundle-relative one.
            notebook_path: /Users/stuart.libby@databricks.com/pipeline-bike/_resources/01-Bike-Data-generator
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
        - task_key: start_dlt_pipeline
          depends_on:
            - task_key: generate_data
          pipeline_task:
            pipeline_id: ${resources.pipelines.pipeline_bike.id}
            full_refresh: true
