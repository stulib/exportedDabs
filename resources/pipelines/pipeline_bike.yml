resources:
  pipelines:
    pipeline_bike:
      name: pipeline-bike
      serverless: true
      catalog: ${var.catalog}
      schema: ${var.schema}
      configuration:
        catalog: ${var.catalog}
        schema: ${var.schema}
      libraries:
        - file:
            path: ../../src/pipeline-bike/01-bronze.sql
        - file:
            path: ../../src/pipeline-bike/02-silver.sql
        - file:
            path: ../../src/pipeline-bike/03-gold.sql
      event_log:
        catalog: ${var.catalog}
        schema: ${var.schema}
        name: pipeline_bike_event_logs
