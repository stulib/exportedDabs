resources:
  alerts:
    dm_alert:
      display_name: dm_alert
      query_text: "SELECT count(*) AS cnt FROM ${var.catalog}.${var.schema}.dm_seed_events"
      warehouse_id: ${var.warehouse_id}
      evaluation:
        comparison_operator: GREATER_THAN
        source:
          aggregation: SUM
          name: cnt
        threshold:
          value:
            double_value: 1000000
      schedule:
        pause_status: PAUSED
        quartz_cron_schedule: "0 0 8 * * ?"
        timezone_id: America/New_York
