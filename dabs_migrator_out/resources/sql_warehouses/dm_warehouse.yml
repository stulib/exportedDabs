resources:
  sql_warehouses:
    dm_warehouse:
      name: "dm_warehouse"
      cluster_size: "2X-Small"
      auto_stop_mins: 5
      max_num_clusters: 1
      min_num_clusters: 1
      enable_photon: true
      enable_serverless_compute: true
      spot_instance_policy: "COST_OPTIMIZED"
      warehouse_type: "PRO"
      tags:
        custom_tags:
          - key: "dev"
            value: "stuart_libby"
