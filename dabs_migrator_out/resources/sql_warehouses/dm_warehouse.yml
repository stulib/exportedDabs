      name: dm_warehouse
      cluster_size: "2X-Small"
      min_num_clusters: 1
      max_num_clusters: 1
      auto_stop_mins: 5
      enable_photon: true
      enable_serverless_compute: true
      spot_instance_policy: COST_OPTIMIZED
      warehouse_type: PRO
