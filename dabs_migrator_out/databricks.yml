bundle:
  name: dabs_migrator_out

include:
  - resources/**/*.yml

variables:
  catalog:
    description: Default catalog
    default: "classic_stable_aiy0te"

  schema:
    description: Default schema
    default: "dabs_test"

targets:
  dev:
    mode: development
    default: true
    workspace:
      host: https://adb-7405613676539969.9.azuredatabricks.net

  staging:
    mode: production
    workspace:
      host: https://adb-7405613676539969.9.azuredatabricks.net
      root_path: /Workspace/Shared/.bundle/${bundle.name}/${bundle.target}
    run_as:
      service_principal_name: ${var.staging_sp_app_id}

  prod:
    mode: production
    workspace:
      host: https://adb-7405613676539969.9.azuredatabricks.net
      root_path: /Workspace/Shared/.bundle/${bundle.name}/${bundle.target}
    run_as:
      service_principal_name: ${var.prod_sp_app_id}
    permissions:
      - level: CAN_VIEW
        group_name: users
